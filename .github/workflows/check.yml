name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish this tested main commit for the BGL server
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check browser and deployment syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
          for file in deployment/*.sh; do bash -n "$file"; done
      - name: Package tracked source only
        run: python deployment/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackgoldlink-source
          path: |
            /tmp/bgl-package/blackgoldlink-source.tar.gz
            /tmp/bgl-package/SHA256SUMS
          retention-days: 7
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python deployment/package-release.py
      - name: Publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="bgl-live-$COMMIT"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo 'This commit already has a release. Nothing to overwrite.'
            exit 0
          fi
          gh release create "$tag" /tmp/bgl-package/blackgoldlink-source.tar.gz /tmp/bgl-package/SHA256SUMS --repo "$REPO" --target "$COMMIT" --title "BlackGoldLink ${COMMIT:0:7}" --notes 'Tests passed; explicitly approved for the BGL updater. The server may defer while imports are running, or reject changes requiring a manual migration.' --latest=false
