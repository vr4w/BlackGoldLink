{% set relation=friend_state(chat_peer.id) %}<aside class="compare-chat" data-chat-shell data-peer="{{ chat_peer.id }}"><details {% if relation and relation.state=='accepted' %}open{% endif %}><summary>{{ t('Messages') }} · {{ name_b }}</summary>{% if relation and relation.state=='accepted' %}<div data-chat data-endpoint="{{ url_for('chat_read',uid=chat_peer.id) }}" data-peer="{{ chat_peer.id }}" data-self="{{ user.id }}" data-csrf="{{ csrf }}"><div class="chat-presence"><i data-online></i><span data-presence>{{ t('Offline') }}</span></div><button type="button" class="chat-older" data-chat-older hidden>{{ t('Older messages') }}</button><div class="chat-messages" data-messages role="log" aria-label="{{ t('Messages') }}" aria-live="polite"></div><form data-chat-form><label class="sr-only" for="chat-message">{{ t('Write a message…') }}</label><textarea id="chat-message" rows="2" maxlength="2000" required placeholder="{{ t('Write a message…') }}"></textarea><button class="button small">{{ t('Send') }}</button></form><small data-chat-status role="status"></small></div>{% else %}<p class="fine">{{ t('Chat is available to confirmed friends.') }}</p>{% set member=chat_peer %}{% include 'components/friend_action.html' %}{% endif %}</details></aside>
